site:
  title: ARC42 Software Architecture Documentation Template
  start_page: doc:ROOT:01_introduction_and_goals.adoc
  url: https://drehtuer.github.io/antora/

output:
  clean: true
  dir: build

runtime:
  cache_dir: ./.cache/antora

content:
  sources:
    - url: https://github.com/drehtuer/antora.git
      start_path: doc

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files:
    - path: ui.yml
      contents: |
        static_files:
        - .nojekyll
    - path: .nojekyll

antora:
  extensions:
    - require: "asciidoctor-treeview/antora"
    - require: "@sntke/antora-mermaid-extension"
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true

asciidoc:
  sourcemap: true
  extensions:
    - "@deepsymmetry/asciidoctor-bytefield"
  attributes:
    icons: font
    icontype: svg
    lang: en
    page-pagination: ""
